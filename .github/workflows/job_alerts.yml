
name: Job Scraper Bot
on:
  schedule:
    - cron: '0 8,14 * * *'
  workflow_dispatch:

permissions:
  contents: write # CRITICAL: Required to push the updated text file back

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_SEND: '250' # Increase the cap to allow jobs from other sources
        run: python scraper.py

      - name: Commit seen jobs state
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update seen jobs state"
          file_pattern: '.seen_jobs.txt'
